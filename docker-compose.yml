services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: crm, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment: { DATABASE_URL: postgresql://postgres:postgres@db:5432/crm }
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment: { VITE_API_URL: http://localhost:8000 }
